name: Android quality and release

on:
  push:
    branches: [main, master]
    paths:
      - "android/**"
      - "scripts/build-apk.ps1"
      - "scripts/build-release.ps1"
      - "scripts/validate-android-release.mjs"
      - ".github/workflows/android-apk.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "android/**"
      - "scripts/build-apk.ps1"
      - "scripts/build-release.ps1"
      - "scripts/validate-android-release.mjs"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:
    inputs:
      version_code:
        description: "Monotonically increasing Play versionCode"
        required: true
        default: "3"
      version_name:
        description: "User-visible versionName"
        required: true
        default: "1.1.0"

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"

jobs:
  verify:
    name: Lint, unit tests, and unsigned packages
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate Android release invariants
        run: node scripts/validate-android-release.mjs

      - name: Validate Gradle wrapper integrity
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Validate pinned Gradle wrapper
        working-directory: android
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --version

      - name: Run release quality gates
        working-directory: android
        shell: bash
        run: >-
          ./gradlew
          lintRelease
          testReleaseUnitTest
          assembleDebug
          assembleRelease
          bundleRelease
          --stacktrace
          --no-daemon

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arch-android-verification-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/reports/lint-results-release.*
            android/app/build/reports/tests/testReleaseUnitTest/**
            android/app/build/test-results/testReleaseUnitTest/**

  signed-release:
    name: Signed Play release
    needs: verify
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check signing secrets
        id: signing
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          KEYSTORE_BASE64: ${{ secrets.ARCH_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ARCH_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ARCH_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ARCH_ANDROID_KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ vars.ARCH_ANDROID_UPLOAD_CERT_SHA256 }}
        run: |
          secret_count=0
          for value in "$KEYSTORE_BASE64" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            [[ -n "$value" ]] && secret_count=$((secret_count + 1))
          done

          if [[ "$secret_count" -eq 4 ]]; then
            if [[ -z "$EXPECTED_CERT_SHA256" ]]; then
              echo "available=false" >> "$GITHUB_OUTPUT"
              echo "### Signed release failed" >> "$GITHUB_STEP_SUMMARY"
              echo "Repository variable ARCH_ANDROID_UPLOAD_CERT_SHA256 is required." >> "$GITHUB_STEP_SUMMARY"
              echo "::error::ARCH_ANDROID_UPLOAD_CERT_SHA256 is not configured."
              exit 1
            fi
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "### Signed release requested" >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$secret_count" -gt 0 ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "### Signed release failed" >> "$GITHUB_STEP_SUMMARY"
            echo "Signing secrets are only partially configured ($secret_count/4)." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Android signing secrets are partially configured."
            exit 1
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "### Signed release failed" >> "$GITHUB_STEP_SUMMARY"
            echo "A manual release requires all four signing secrets." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Manual release requested without Android signing secrets."
            exit 1
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "### Signed release skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "Push verification completed without configured signing secrets." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up JDK 17
        if: steps.signing.outputs.available == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Set up Android SDK
        if: steps.signing.outputs.available == 'true'
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        if: steps.signing.outputs.available == 'true'
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle cache
        if: steps.signing.outputs.available == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Validate pinned Gradle wrapper
        if: steps.signing.outputs.available == 'true'
        working-directory: android
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --version

      - name: Decode upload keystore
        if: steps.signing.outputs.available == 'true'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ARCH_ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/arch-upload-key.jks"

      - name: Verify Play upload certificate
        if: steps.signing.outputs.available == 'true'
        shell: bash
        env:
          ARCH_KEYSTORE_PASSWORD: ${{ secrets.ARCH_ANDROID_KEYSTORE_PASSWORD }}
          ARCH_KEY_ALIAS: ${{ secrets.ARCH_ANDROID_KEY_ALIAS }}
          EXPECTED_CERT_SHA256: ${{ vars.ARCH_ANDROID_UPLOAD_CERT_SHA256 }}
        run: |
          expected=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')
          if [[ ! "$expected" =~ ^[0-9A-F]{64}$ ]]; then
            echo "::error::ARCH_ANDROID_UPLOAD_CERT_SHA256 must contain exactly 64 hexadecimal characters."
            exit 1
          fi

          actual=$(
            "$JAVA_HOME/bin/keytool" \
              '-J-Duser.language=en' \
              '-J-Duser.country=US' \
              -list -v \
              -keystore "$RUNNER_TEMP/arch-upload-key.jks" \
              -storepass:env ARCH_KEYSTORE_PASSWORD \
              -alias "$ARCH_KEY_ALIAS" |
              awk -F'SHA256: ' '/SHA256:/{print $2; exit}' |
              tr -d '[:space:]:' |
              tr '[:lower:]' '[:upper:]'
          )

          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Upload certificate SHA-256 does not match the Play-approved fingerprint."
            exit 1
          fi
          echo "Upload certificate verified: $actual" >> "$GITHUB_STEP_SUMMARY"

      - name: Build signed APK and AAB
        if: steps.signing.outputs.available == 'true'
        working-directory: android
        shell: bash
        env:
          ARCH_KEYSTORE_FILE: ${{ runner.temp }}/arch-upload-key.jks
          ARCH_KEYSTORE_PASSWORD: ${{ secrets.ARCH_ANDROID_KEYSTORE_PASSWORD }}
          ARCH_KEY_ALIAS: ${{ secrets.ARCH_ANDROID_KEY_ALIAS }}
          ARCH_KEY_PASSWORD: ${{ secrets.ARCH_ANDROID_KEY_PASSWORD }}
          ARCH_VERSION_CODE: ${{ github.event.inputs.version_code || vars.ARCH_ANDROID_VERSION_CODE || '3' }}
          ARCH_VERSION_NAME: ${{ github.event.inputs.version_name || vars.ARCH_ANDROID_VERSION_NAME || '1.1.0' }}
        run: >-
          ./gradlew
          clean
          lintRelease
          testReleaseUnitTest
          assembleRelease
          bundleRelease
          --stacktrace
          --no-daemon

      - name: Verify APK signature
        if: steps.signing.outputs.available == 'true'
        shell: bash
        env:
          EXPECTED_CERT_SHA256: ${{ vars.ARCH_ANDROID_UPLOAD_CERT_SHA256 }}
        run: |
          expected=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')
          verification=$(
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs \
              android/app/build/outputs/apk/release/app-release.apk
          )
          printf '%s\n' "$verification"
          actual=$(
            printf '%s\n' "$verification" |
              awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print $2; exit}' |
              tr -d '[:space:]:' |
              tr '[:lower:]' '[:upper:]'
          )
          if [[ ! "$actual" =~ ^[0-9A-F]{64}$ || "$actual" != "$expected" ]]; then
            echo "::error::Signed APK certificate SHA-256 does not match the Play-approved fingerprint."
            exit 1
          fi
          echo "Signed APK certificate verified: $actual" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify AAB signature
        if: steps.signing.outputs.available == 'true'
        shell: bash
        env:
          ARCH_KEYSTORE_PASSWORD: ${{ secrets.ARCH_ANDROID_KEYSTORE_PASSWORD }}
        run: >-
          "$JAVA_HOME/bin/jarsigner"
          -verify
          -strict
          -certs
          -keystore "$RUNNER_TEMP/arch-upload-key.jks"
          -storepass:env ARCH_KEYSTORE_PASSWORD
          android/app/build/outputs/bundle/release/app-release.aab

      - name: Create release manifest
        if: steps.signing.outputs.available == 'true'
        shell: bash
        env:
          EXPECTED_CERT_SHA256: ${{ vars.ARCH_ANDROID_UPLOAD_CERT_SHA256 }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          apk = Path("android/app/build/outputs/apk/release/app-release.apk")
          aab = Path("android/app/build/outputs/bundle/release/app-release.aab")
          apk_metadata = Path("android/app/build/outputs/apk/release/output-metadata.json")
          output = Path("android/app/build/outputs/release-manifest.json")

          def sha256(path):
              digest = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest().upper()

          metadata = json.loads(apk_metadata.read_text(encoding="utf-8"))
          release = metadata["elements"][0]
          manifest = {
              "applicationId": metadata["applicationId"],
              "versionCode": release["versionCode"],
              "versionName": release["versionName"],
              "targetSdk": 36,
              "uploadCertificateSha256": os.environ["EXPECTED_CERT_SHA256"].replace(":", "").strip().upper(),
              "signatureChecks": ["apksigner verify", "jarsigner -verify -strict"],
              "artifacts": {
                  apk.name: {"sha256": sha256(apk), "bytes": apk.stat().st_size},
                  aab.name: {"sha256": sha256(aab), "bytes": aab.stat().st_size},
              },
          }
          output.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Upload signed Play artifacts
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: arch-android-release-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 30
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/mapping/release/mapping.txt
            android/app/build/outputs/apk/release/output-metadata.json
            android/app/build/outputs/release-manifest.json
            android/app/build/reports/lint-results-release.*
            android/app/build/reports/tests/testReleaseUnitTest/**
            android/app/build/test-results/testReleaseUnitTest/**

      - name: Record signed release completion
        if: steps.signing.outputs.available == 'true'
        shell: bash
        run: echo "Signed APK, Play AAB, mapping, metadata, and release manifest uploaded." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove decoded keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/arch-upload-key.jks"
